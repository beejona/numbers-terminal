# The leaderboard for https://beejona.github.io/numbers-terminal/ - a Cloudflare Worker with a D1
# (SQLite) database. Deploy from this folder: npx wrangler deploy
name = "numbers-terminal-leaderboard"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "numbers-terminal-leaderboard"
database_id = "65b008b0-bbca-43f5-91bf-ea44cdb9a8bf"
migrations_dir = "migrations"

# One Durable Object per ranked terminal: the connection's state and clock (src/session.js).
[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "TerminalSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TerminalSession"]

[vars]
# Pages allowed to call the leaderboard from a browser. (Local testing runs its own server.)
ALLOWED_ORIGINS = "https://beejona.github.io"

# Per-address limits, kept by Cloudflare (period is 10 or 60 seconds). The page reads the board
# every 15 s while it's open, plus a name check while typing.
[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "POST_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# ADMIN_TOKEN (for taking names off the board) is a secret: npx wrangler secret put ADMIN_TOKEN
